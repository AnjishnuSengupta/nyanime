services:
  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE: NyAnime Main Backend (Node.js / Express API)
  # Handles API proxying, stream proxying, Firebase admin, and WebTorrent.
  # Also internally spawns the AnimeKAI and Anipy Python microservices.
  # The React frontend is served from Cloudflare Pages (static hosting).
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: nyanime
    runtime: node
    plan: free
    buildCommand: python3 -m venv venv && ./venv/bin/pip install -r anipy_api_service/requirements.txt -r animekai_api_service/requirements.txt && npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANIMEKAI_URL
        value: https://anikai.to
      - key: ENCDEC_URL
        value: https://enc-dec.app/api/enc-kai
      - key: ENCDEC_DEC_KAI
        value: https://enc-dec.app/api/dec-kai
      - key: ENCDEC_DEC_MEGA
        value: https://enc-dec.app/api/dec-mega
      - key: JIMAKU_API_TOKEN
        sync: false
