services:
  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE 1: AnimeKAI API Backend
  # Handles all AnimeKAI scraping server-side.
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: animekai-api
    runtime: python
    plan: free
    rootDir: animekai_api_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANIMEKAI_URL
        value: https://anikai.to
      - key: ENCDEC_URL
        value: https://enc-dec.app/api/enc-kai
      - key: ENCDEC_DEC_KAI
        value: https://enc-dec.app/api/dec-kai
      - key: ENCDEC_DEC_MEGA
        value: https://enc-dec.app/api/dec-mega


  # ══════════════════════════════════════════════════════════════════════════
  # SERVICE 3: NyAnime Main Backend (Node.js / Express API)
  # Handles API proxying, stream proxying, Firebase admin, and WebTorrent.
  # The React frontend is served from Cloudflare Pages (static hosting).
  # VITE_* env vars are set on Cloudflare Pages — NOT needed here.
  # server.js auto-constructs ANIMEKAI_API_URL from RENDER_EXTERNAL_URL.
  # ══════════════════════════════════════════════════════════════════════════
  - type: web
    name: nyanime
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANIPY_API_URL
        sync: false
      - key: JIMAKU_API_TOKEN
        sync: false
